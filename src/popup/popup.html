<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJ AIO Metadata Settings</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Top Header Bar -->
    <header class="popup-header">
      <div class="brand-group">
        <div class="brand-title">
          <span class="logo-badge">RJ</span>
          <span>AIO Metadata</span>
        </div>
        <span class="version-tag">v0.1.0</span>
      </div>
      <button id="btnLaunchOverlay" class="rj-btn rj-btn-secondary rj-btn-sm" title="Launch Floating In-Page Overlay">
        <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span>Open HUD</span>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="popup-content">
      <!-- Section 1: Target Platform Selector & Live Detector -->
      <section class="rj-card">
        <div class="rj-card-title rj-card-title-split">
          <div class="rj-title-text">
            <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            <span>Target Microstock Platform</span>
          </div>
          <span id="platformStatusBadge" class="rj-status-badge rj-status-unmatched" title="Tab match status">
            <svg id="statusIcon" class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="statusText">Checking</span>
          </span>
        </div>

        <div class="rj-field-group">
          <select id="platformSelect" class="rj-select">
            <option value="adobestock">Adobe Stock Contributor</option>
            <option value="shutterstock">Shutterstock Contributor</option>
            <option value="freepik">Freepik Contributor</option>
            <option value="vecteezy">Vecteezy Contributor</option>
            <option value="dreamstime">Dreamstime Upload</option>
            <option value="depositphotos">Depositphotos Unfinished</option>
            <option value="miricanvas">MiriCanvas DesignHub</option>
          </select>
        </div>

        <!-- Mismatch Helper Alert -->
        <div id="platformWarningBanner" class="rj-platform-warning" style="display: none;">
          <span id="warningMessage">You are not on the selected platform page.</span>
          <a id="btnNavigatePlatform" class="rj-platform-link">Open Page</a>
        </div>
      </section>

      <!-- Section 2: AI Provider & Model Configuration -->
      <section class="rj-card">
        <div class="rj-card-title">
          <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          <span>AI Provider</span>
        </div>

        <!-- Provider Selector -->
        <div class="rj-field-group">
          <label class="rj-field-label" for="providerSelect">
            <span>Provider Engine</span>
          </label>
          <select id="providerSelect" class="rj-select">
            <option value="gemini">Google Gemini</option>
            <option value="mistral">Mistral AI</option>
            <option value="openai">OpenAI</option>
            <option value="openrouter">OpenRouter</option>
            <option value="custom">Custom Endpoint</option>
          </select>
        </div>

        <!-- Base URL -->
        <div class="rj-field-group">
          <label class="rj-field-label" for="baseUrlInput">
            <span>Base URL Endpoint</span>
          </label>
          <input type="text" id="baseUrlInput" class="rj-input" placeholder="https://api.openai.com/v1">
        </div>

        <!-- API Key with Show/Hide & File Import (Single or Multi-key) -->
        <div class="rj-field-group">
          <label class="rj-field-label" for="apiKeyInput">
            <span>API Key</span>
            <span class="rj-field-hint" id="apiKeyCountHint">Supports single or multi-line keys</span>
          </label>
          <div class="rj-input-with-action">
            <input type="password" id="apiKeyInput" class="rj-input" placeholder="Enter key(s) or import .txt file...">
            <button type="button" id="btnToggleApiKey" class="rj-btn-icon" title="Show / Hide API Key">
              <svg id="eyeIcon" class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
            <button type="button" id="btnBrowseApiKey" class="rj-file-btn" title="Import API Key(s) from .txt file">
              <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>.txt File</span>
            </button>
            <input type="file" id="apiKeyFileInput" accept=".txt" style="display: none;">
          </div>
        </div>

        <!-- Model Selection + Fetch Models Button -->
        <div class="rj-field-group">
          <label class="rj-field-label" for="modelSelect">
            <span>Model</span>
            <span class="rj-field-hint" id="modelCountLabel">Fetch models required</span>
          </label>
          <div class="rj-input-with-action">
            <select id="modelSelect" class="rj-select" disabled>
              <option value="" disabled selected>Input API key first</option>
            </select>
            <button type="button" id="btnFetchModels" class="rj-btn-icon" title="Fetch live models from provider (/v1/models)">
              <svg id="fetchIcon" class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Section 3: Platform-Adaptive Metadata Settings -->
      <section class="rj-card">
        <div class="rj-card-title">
          <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          <span id="platformSettingsHeaderTitle">Metadata Settings</span>
        </div>

        <!-- Fully Dynamic Form Container (Zero hardcoded fields, no hairline divider) -->
        <div id="platformDynamicForm"></div>
      </section>
    </main>

    <!-- Footer Action Bar -->
    <footer class="popup-footer">
      <button type="button" id="btnSaveSettings" class="rj-btn rj-btn-secondary">
        <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>Save Settings</span>
      </button>

      <button type="button" id="btnToggleAutomation" class="rj-btn rj-btn-accent">
        <svg id="automationIcon" class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span id="automationBtnText">Start Automation</span>
      </button>
    </footer>

    <!-- Toast Notification -->
    <div id="toastNotification" class="rj-toast">
      <svg class="rj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span id="toastMessage">Settings saved successfully</span>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
